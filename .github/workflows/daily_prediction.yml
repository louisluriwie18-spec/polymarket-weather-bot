name: Daily 5PM GMT Prediction & Accuracy Audit

on:
  schedule:
    # 17:00 UTC = 5:00 PM GMT every day
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict_and_audit:
    name: Run Prediction Model & Audit Accuracy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Historical Weather Data
        uses: actions/cache@v4
        with:
          path: historical_cache.json
          key: weather-historical-cache-${{ runner.os }}-${{ hashFiles('config.py') }}
          restore-keys: |
            weather-historical-cache-${{ runner.os }}-

      - name: Execute Daily Prediction Cycle
        env:
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          DRY_RUN: "true"
          DRY_RUN_STARTING_BANKROLL: "20.0"
        run: |
          python main.py --once

      - name: Generate Accuracy Report to Summary
        run: |
          echo "## 📊 Polymarket Weather Bot — Daily Performance & Accuracy Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          python accuracy_report.py >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Latest Trade Audit Ledger" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          python main.py --trades >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit & Push Updated Trade Ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add past_trades.txt trades.db || true
          if git diff --staged --quiet; then
            echo "No changes in trades or ledger to commit."
          else
            git commit -m "chore(bot): automated daily predictions and resolution ledger [skip ci]"
            git push origin main
          fi

      - name: Upload Artifacts (Trades & Ledger)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-trades-and-ledger
          path: |
            past_trades.txt
            trades.db
          retention-days: 30
